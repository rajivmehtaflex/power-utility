[project]
name = "hf-converter-scripts"
version = "0.1.0"
description = "Pinned dependency environment for the hf-generative-model-converter helper scripts (manifest + publication)"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.21,<5",
    "huggingface_hub>=0.34.0,<1.0",
]

[tool.uv]
package = false
# Binary policy: exclude the native hf-xet extension; use the supported plain-HTTP
# transfer route (HF_HUB_DISABLE_XET=1). Declared, audited choice per references/source-builds.md.
override-dependencies = ["hf-xet; sys_platform == 'never'"]
