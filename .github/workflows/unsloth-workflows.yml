name: unsloth-workflows

on:
  push:
    paths:
      - "repo-owned/unsloth-workflows/**"
      - "tools/import_generated_skills.py"
      - "tests/test_import_generated_skills.py"
      - "MANIFEST.json"
      - "README.md"
      - "VALIDATION_REPORT.md"
      - ".github/workflows/unsloth-workflows.yml"
  pull_request:
    paths:
      - "repo-owned/unsloth-workflows/**"
      - "tools/import_generated_skills.py"
      - "tests/test_import_generated_skills.py"
      - "MANIFEST.json"
      - "README.md"
      - "VALIDATION_REPORT.md"
      - ".github/workflows/unsloth-workflows.yml"

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
      - name: Run portable skill tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s repo-owned/unsloth-workflows/tests -v
      - name: Validate Agent Skills package
        run: npx -y skills-ref validate repo-owned/unsloth-workflows
      - name: Validate catalog JSON
        run: python -m json.tool MANIFEST.json > /dev/null
      - name: Check Python syntax
        run: python -m compileall -q repo-owned/unsloth-workflows/scripts tools/import_generated_skills.py
