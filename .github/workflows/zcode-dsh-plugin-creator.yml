name: zcode-dsh-plugin-creator

on:
  push:
    paths:
      - "repo-owned/zcode-dsh-plugin-creator/**"
      - "tests/test_zcode_dsh_plugin_creator_package.py"
      - "tools/import_generated_skills.py"
      - "tools/skill-validation/**"
      - ".github/workflows/zcode-dsh-plugin-creator.yml"
      - "MANIFEST.json"
      - "README.md"
      - "VALIDATION_REPORT.md"
  pull_request:
    paths:
      - "repo-owned/zcode-dsh-plugin-creator/**"
      - "tests/test_zcode_dsh_plugin_creator_package.py"
      - "tools/import_generated_skills.py"
      - "tools/skill-validation/**"
      - ".github/workflows/zcode-dsh-plugin-creator.yml"
      - "MANIFEST.json"
      - "README.md"
      - "VALIDATION_REPORT.md"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.18"
          enable-cache: false
      - name: Locked validator environment
        run: uv sync --project tools/skill-validation --locked
      - name: Validate Agent Skills package
        run: uv run --project tools/skill-validation skills-ref validate repo-owned/zcode-dsh-plugin-creator
      - name: Root structural/catalog tests
        run: uv run --project tools/skill-validation python -m unittest tests.test_zcode_dsh_plugin_creator_package -v
      - name: Validate catalog JSON
        run: python -m json.tool MANIFEST.json > /dev/null
